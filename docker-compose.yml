services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/pyvd.db
      DOWNLOAD_DIR: /tmp/pyvd
      SIGNAL_SERVICE: signal-cli-rest-api:8080
      REDLIB_SERVICE: redlib:8080
    volumes:
      - db_data:/data
    ports:
      - "5868:5868"
    depends_on:
      # the sidecar takes ~15s to boot signal-cli into daemon mode; without
      # service_healthy the bot starts first and logs connection errors until
      # it catches up
      signal-cli-rest-api:
        condition: service_healthy
    networks:
      - bot
  
  redlib:
    # quay.io/redlib/redlib:latest is stale upstream and fails to obtain a
    # Reddit OAuth token (https://github.com/redlib-org/redlib/issues/551).
    # This is an actively-rebuilt fork tracking main.
    image: ghcr.io/evrial/redlib:latest
    restart: always
    container_name: "redlib"
    # ports:
    #   - 8080:8080 # Specify `127.0.0.1:8080:8080` instead if using a reverse proxy
    user: nobody
    read_only: true
    security_opt:
      - no-new-privileges:true
      # - seccomp=seccomp-redlib.json
    cap_drop:
      - ALL
    env_file: .env
    environment:
      REDLIB_DEFAULT_SHOW_NSFW: on
    networks:
      - bot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--tries=1", "http://localhost:8080/settings"]
      interval: 5m
      timeout: 3s

  signal-cli-rest-api:
    image: bbernhard/signal-cli-rest-api:latest
    restart: unless-stopped
    environment:
      MODE: json-rpc
    volumes:
      # Set SIGNAL_CLI_DATA_DIR to an existing host signal-cli config dir
      # (e.g. ~/.local/share/signal-cli) to reuse an already-registered
      # account; otherwise the account lives in the signal_data volume.
      - ${SIGNAL_CLI_DATA_DIR:-signal_data}:/home/.local/share/signal-cli
    networks:
      - bot

volumes:
  db_data:
  signal_data:

networks:
  bot:
